name: Build SukiSU Nova kernel (OnePlus 15R)

# stage = dry-run : fetch source, apply every patch, write the config, stop (about 10 minutes). Use it after any pin change.
# stage = build   : full compile + post-build verification + AnyKernel3 zip as a workflow artifact.
# stage = release : build, and only if verify.sh passed, publish a GitHub Release (marked pre-release: not boot-tested).

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "How far to go"
        type: choice
        options: [dry-run, build, release]
        default: build
      lto:
        description: "Link-time optimisation"
        type: choice
        options: [thin, full, none]
        default: full
      tuning:
        description: "WildKernels tuning patches (18)"
        type: boolean
        default: true
      unicode:
        description: "Unicode bypass fix (experimental)"
        type: boolean
        default: true
      full_lto_inline:
        description: "Full LTO only: link-time inline threshold (0 = no extra cross-file inlining, like ThinLTO's limit)"
        type: string
        default: "0"
      max_image_mib:
        description: "Refuse an Image bigger than this (MiB); the booting thin build is 46.3"
        type: string
        default: "47"

permissions:
  contents: write

# every run step gets bash -eo pipefail, so `verify.sh | tee` cannot hide a failure
defaults:
  run:
    shell: bash

concurrency:
  group: build-${{ github.ref }}-${{ inputs.stage }}-${{ inputs.lto }}-${{ inputs.tuning }}-${{ inputs.unicode }}
  cancel-in-progress: false

env:
  KROOT: ${{ github.workspace }}/kernel
  WORK: ${{ github.workspace }}/work
  OUT: ${{ github.workspace }}/out
  LTO: ${{ inputs.lto }}

jobs:
  kernel:
    name: Kernel (6.12.69, ${{ inputs.stage }}, lto=${{ inputs.lto }}, inline=${{ inputs.full_lto_inline }}, tuning=${{ inputs.tuning }}, unicode=${{ inputs.unicode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space and add swap
        run: |
          set -x
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift || true
          sudo docker image prune -af || true
          df -h /
          # LTO links need more than the 16 GB of RAM a runner has
          sudo swapoff -a || true
          sudo fallocate -l 24G /swapfile && sudo chmod 600 /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile
          free -h

      - name: Host tools
        run: |
          for i in 1 2 3 4; do sudo apt-get update -qq && sudo apt-get install -y -qq git-core gnupg flex bison build-essential zip curl \
            libc6-dev libncurses-dev libssl-dev libelf-dev dwarves rsync python3 perl dos2unix && break; sleep 15; done
          mkdir -p "$HOME/bin"
          curl -fsSL --retry 5 https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name ci && git config --global user.email ci@localhost
          git config --global --add safe.directory '*'

      - name: Sync Google kernel source (pinned to the phone's commit)
        run: bash scripts/sync-source.sh

      - name: Integrate SukiSU Nova, SUSFS, NoMount, Baseband Guard, NTSync, tuning
        run: bash scripts/integrate.sh
        env:
          WITH_TUNING: ${{ inputs.tuning }}
          WITH_UNICODE: ${{ inputs.unicode }}
          FULL_LTO_INLINE: ${{ inputs.full_lto_inline }}

      - name: Fetch the SukiSU Nova manager and check it matches the kernel's trusted certificate
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq apksigner
          mkdir -p "$WORK/manager" "$OUT"
          gh release download --repo SukiSU-Nova/SukiSU-Nova --pattern 'SukiSU_Nova_v*-release.apk' --dir "$WORK/manager" --clobber
          APK=$(ls "$WORK/manager"/*.apk | head -1)
          CERT=$(apksigner verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          WANT=$(sed -n 's/^KSU_EXPECTED_HASH := //p' "$KROOT/KernelSU/kernel/Makefile")
          echo "manager: $(basename "$APK")"; echo "apk cert : $CERT"; echo "kernel   : $WANT"
          [ -n "$CERT" ] && [ "$CERT" = "$WANT" ] || { echo "::error::manager APK certificate does not match the kernel's compiled-in one"; exit 1; }
          cp "$APK" "$OUT/"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Configure (defconfig, module compatibility, release string)
        run: bash scripts/configure.sh

      - name: Upload integration diff (for review)
        if: always()
        run: |
          mkdir -p "$OUT"
          git -C "$KROOT/common" diff --stat HEAD~1 HEAD > "$OUT/changed-files.txt" 2>/dev/null || true
          find "$KROOT/common" \( -name '*.rej' -o -name '*.orig' \) -not -path '*/.git/*' > "$OUT/rejects.txt" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-report
          path: out/
          if-no-files-found: ignore

      - name: Config-only check (resolve the final .config, assert config/required.txt)
        working-directory: ${{ env.KROOT }}
        run: |
          set -o pipefail
          tools/bazel query '//common:all' 2>/dev/null | grep -E ':kernel_aarch64_config$' || { echo "::error::no kernel_aarch64_config target"; exit 1; }
          tools/bazel build --config=fast --lto="$LTO" --disk_cache="$HOME/.cache/bazel" //common:kernel_aarch64_config 2>&1 | tail -30
          CONFIG_ONLY=1 bash "$GITHUB_WORKSPACE/scripts/verify.sh" 2>&1 | tee "$OUT/config-check.log"

      - name: LTO diagnostics (read-only)
        if: always() && inputs.lto != 'none'
        run: bash scripts/diag-lto.sh 2>&1 | tee "$OUT/lto-diag.log"

      - name: Build kernel (Kleaf / Bazel)
        if: inputs.stage != 'dry-run'
        working-directory: ${{ env.KROOT }}
        run: |
          set -o pipefail
          tools/bazel build --config=fast --lto="$LTO" --disk_cache="$HOME/.cache/bazel" //common:kernel_aarch64/Image 2>&1 | tee "$WORK/bazel.log"
          mkdir -p "$WORK/raw"
          cp bazel-bin/common/kernel_aarch64/Image "$WORK/raw/Image"
          cp "$(find bazel-bin/common -name .config -path '*kernel_aarch64*' | head -1)" "$WORK/raw/final.config" || true

      # keep the compiled Image even if a later step (verify, packaging) fails
      - name: Upload raw Image
        if: always() && inputs.stage != 'dry-run'
        uses: actions/upload-artifact@v4
        with:
          name: raw-image-lto-${{ inputs.lto }}-tuning-${{ inputs.tuning }}-unicode-${{ inputs.unicode }}
          path: work/raw/
          if-no-files-found: ignore

      - name: Image size gate (an oversized full-LTO Image did not boot)
        if: inputs.stage != 'dry-run'
        env:
          MAX_IMAGE_MIB: ${{ inputs.max_image_mib }}
        run: |
          python3 - "$WORK/raw/Image" <<'PY'
          import os, struct, sys
          d = open(sys.argv[1], 'rb').read(64)
          assert d[56:60] == b'ARM\x64', 'not an arm64 Image'
          size = struct.unpack('<Q', d[16:24])[0] / 2**20   # header image_size: file + BSS, what the bootloader reserves
          lim = float(os.environ['MAX_IMAGE_MIB'])
          print(f"Image: file {os.path.getsize(sys.argv[1])/2**20:.2f} MiB, image_size {size:.2f} MiB, limit {lim} MiB")
          if size > lim:
              print(f"::error::Image image_size {size:.2f} MiB > {lim} MiB (booting thin build: 46.25 MiB)"); sys.exit(1)
          PY

      - name: Verify the built kernel against config/required.txt
        if: inputs.stage != 'dry-run'
        run: bash scripts/verify.sh 2>&1 | tee "$OUT/verify.log"

      - name: Package AnyKernel3
        if: inputs.stage != 'dry-run'
        run: |
          set -euo pipefail
          source pins.env
          source scripts/lib.sh
          clone_at "$ANYKERNEL_REPO" "$WORK/AnyKernel3" "$ANYKERNEL_PIN"
          rm -rf "$WORK/AnyKernel3/.git" "$WORK/AnyKernel3/.github" "$WORK/AnyKernel3/README.md" "$WORK/AnyKernel3/ramdisk" "$WORK/AnyKernel3/patch" "$WORK/AnyKernel3/modules"
          cp anykernel/anykernel.sh "$WORK/AnyKernel3/anykernel.sh"
          cp "$KROOT/bazel-bin/common/kernel_aarch64/Image" "$WORK/AnyKernel3/Image"
          mkdir -p "$WORK/AnyKernel3/ramdisk" "$WORK/AnyKernel3/patch"
          # the OnePlus 15R cannot run 32-bit binaries: every bundled tool must be 64-bit arm (aarch64)
          for f in "$WORK/AnyKernel3"/tools/*; do
            [ "$(head -c4 "$f" | od -An -tx1 | tr -d ' ')" = 7f454c46 ] || continue
            [ "$(od -An -j4 -N1 -tu1 "$f" | tr -d ' ')" = 2 ] && [ "$(od -An -j18 -N2 -tu2 "$f" | tr -d ' ')" = 183 ] \
              || { echo "::error::$(basename "$f") in AnyKernel3 is not an aarch64 binary"; exit 1; }
          done
          NAME="SukiSU-Nova-OP15R-6.12.69-lto-${LTO}-$(date -u +%Y%m%d)"
          echo "ZIPNAME=$NAME" >> "$GITHUB_ENV"
          (cd "$WORK/AnyKernel3" && zip -r9q "$OUT/$NAME-AnyKernel3.zip" . -x '.git*')
          cp "$KROOT/bazel-bin/common/kernel_aarch64/Image" "$OUT/Image"
          (cd "$OUT" && sha256sum Image "$NAME-AnyKernel3.zip" > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Upload kernel
        if: inputs.stage != 'dry-run'
        uses: actions/upload-artifact@v4
        with:
          name: kernel-6.12.69-lto-${{ inputs.lto }}
          path: out/
          retention-days: 30

      - name: Upload bazel log
        if: always() && inputs.stage != 'dry-run'
        uses: actions/upload-artifact@v4
        with:
          name: bazel-log
          path: work/bazel.log
          if-no-files-found: ignore

      - name: Publish release
        if: inputs.stage == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source pins.env
          (cd "$OUT" && sha256sum * > SHA256SUMS.txt)
          TAG="nova-6.12.69-lto-${LTO}-$(date -u +%Y%m%d-%H%M)"
          {
            echo "**Pre-release. Built and config-verified in CI; NOT boot-tested on a device.** Flash only with a way back (stock boot image backed up)."
            echo
            echo "Kernel: Google android16-6.12 \`$COMMON_TAG\` (commit \`$COMMON_COMMIT_PREFIX\`, Linux 6.12.69) - the tree the OnePlus 15R (CPH2767) stock kernel is built from."
            echo "Root: SukiSU Nova \`builtin-new\` @ \`${NOVA_PIN:0:8}\`, manager: only the upstream SukiSU Nova app (\`com.sukisu.nova\`), APK attached unmodified."
            echo
            echo "| Component | Pin |"; echo "|---|---|"
            echo "| SUSFS (gki-android16-6.12) | \`${SUSFS_PIN:0:8}\` |"
            echo "| NoMount | \`${NOMOUNT_PIN:0:8}\` |"
            echo "| Baseband Guard | \`${BBG_PIN:0:8}\` |"
            echo "| WildKernels patches | \`${WILD_PATCHES_PIN:0:8}\` |"
            echo; echo "Verification output:"; echo '```'; tail -60 "$OUT/verify.log"; echo '```'
          } > "$WORK/notes.md"
          gh release create "$TAG" --prerelease --title "SukiSU Nova kernel for OnePlus 15R, 6.12.69 ($TAG)" --notes-file "$WORK/notes.md" \
            "$OUT/$ZIPNAME-AnyKernel3.zip" "$OUT/Image" "$OUT/final.config" "$OUT"/*.apk "$OUT/SHA256SUMS.txt"
